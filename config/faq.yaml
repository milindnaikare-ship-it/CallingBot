# Approved answers to distributor questions. Source: AMC-supplied bot script (empanelment documents FAQs).
# Entries marked "developer-added" are not in the AMC script - Compliance to confirm or remove.

faqs:
  # 1. IFA / Proprietorship
  - question: "What documents are required for IFA/Proprietorship empanelment?"
    answer: "For IFA or Proprietorship, you would need your AMFI Certificate, ARN Card, PAN Card, Cancelled Cheque and KYD."
    tags: [documents, ifa]
  - question: "Is the AMFI Certificate mandatory?"
    answer: "Yes, the AMFI Certificate is required as part of the empanelment process."
    tags: [documents, ifa]
  - question: "Do I need to submit my ARN Card?"
    answer: "Yes, a copy of your ARN Card is required."
    tags: [documents, ifa]
  - question: "Is a cancelled cheque required?"
    answer: "Yes, please keep a cancelled cheque ready for the empanelment process."
    tags: [documents, ifa]

  # 2. Partnership Firm
  - question: "What documents are required for a Partnership Firm?"
    answer: >-
      For a Partnership Firm, you would need the AMFI Certificate, ARN Card, PAN Card, Cancelled Cheque, KYD,
      Principal Officer/Authorised Signatory details and Partnership Deed & Resolution.
    tags: [documents, partnership]
  - question: "Do I need to provide the Partnership Deed?"
    answer: "Yes, the Partnership Deed and Resolution are required for a Partnership Firm."
    tags: [documents, partnership]
  - question: "What are Principal Officer/Authorised Signatory details?"
    answer: >-
      These are the details of the person or persons authorised to represent and operate the partnership firm
      for the empanelment process.
    tags: [documents, partnership]

  # 3. Company
  - question: "What documents are required for a Company?"
    answer: >-
      For a Company, you would need the AMFI Certificate, ARN Card, PAN Card, Cancelled Cheque, KYD, Memorandum
      & Articles of Association, and Principal Officer/Authorised Signatory details.
    tags: [documents, company]
  - question: "Is a Board Resolution required?"
    answer: "Yes, a Board Resolution is required as part of the Company empanelment process."
    tags: [documents, company]
  - question: "Do I need to submit the MOA and AOA?"
    answer: "Yes, a copy of the Memorandum & Articles of Association is required."
    tags: [documents, company]
  - question: "What about authorised signatory details?"
    answer: "Yes, Principal Officer/Authorised Signatory details are required for the Company."
    tags: [documents, company]

  # 4. HUF
  - question: "What documents are required for an HUF?"
    answer: "For an HUF, you would need the ARN Card, PAN Card, Cancelled Cheque and KYD."
    tags: [documents, huf]
  - question: "Is an AMFI Certificate required for HUF?"
    answer: >-
      As per the empanelment document list, the AMFI Certificate is not required for HUF. The required
      documents are ARN Card, PAN Card, Cancelled Cheque and KYD.
    tags: [documents, huf]
  - question: "Do I need any Partnership Deed or Board Resolution for HUF?"
    answer: "No. These documents are not applicable to HUF as per the empanelment requirements."
    tags: [documents, huf]

  # Developer-added safety answers (not in the AMC script) - Compliance to confirm.
  - question: "Are the returns guaranteed?"
    answer: >-
      No. Mutual fund investments are market linked and returns are not guaranteed. Please read all scheme
      related documents carefully.
    tags: [risk, developer-added]
  - question: "How did you get my number?"
    answer: >-
      Your contact details are with us as a mutual fund distributor. If you prefer not to receive calls from
      us, I can remove your number right away.
    tags: [privacy, developer-added]
