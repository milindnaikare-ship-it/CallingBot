# AMC profile - who is calling and how empanelment works.
# Source: AMC-supplied bot script (final_bot_script_with_FAQs.docx). Compliance-reviewed content only.

name: "Carnelian Mutual Fund"
short_name: "Carnelian"
sebi_registration: null                       # TODO (optional): SEBI registration number
bot_name: "Milind"
website: null                                 # TODO (optional): public website
distributor_helpline: null                    # TODO (optional): partner desk phone number
distributor_email: "partnerservices@carnelianmf.com"
distributor_email_spoken: "partnerservices at carnelian M F dot com"

# Direct empanelment link (shared when the partner's email has changed). Sent as a tracked link
# (/r/<token>) that redirects here, so clicks show up on the dashboard. {arn} and {ref} are optional.
empanelment_url_template: "https://partner.carnelianmf.com/empanelment/"

empanelment_steps:
  - "An empanelment email with the details and the link has been sent to the partner's email address registered with AMFI."
  - "Empanelment is an online process and takes approximately 2 to 3 minutes."
  - "If the partner's email has changed, the bot can share the direct empanelment link."
  - "Partner services can assist at partnerservices@carnelianmf.com."

# Documents depend on the entity type - see config/faq.yaml for the approved answers.
empanelment_documents:
  - "IFA / Proprietorship: AMFI Certificate, ARN Card, PAN Card, Cancelled Cheque and KYD."
  - "Partnership Firm: AMFI Certificate, ARN Card, PAN Card, Cancelled Cheque, KYD, Principal Officer/Authorised Signatory details and Partnership Deed & Resolution."
  - "Company: AMFI Certificate, ARN Card, PAN Card, Cancelled Cheque, KYD, Memorandum & Articles of Association, Board Resolution and Principal Officer/Authorised Signatory details."
  - "HUF: ARN Card, PAN Card, Cancelled Cheque and KYD."

rm_team_description: "our partner services team"

distributor_value_props:
  - "Carnelian's founding members, Vikas Khemani, Swati Khemani and Manoj Bahety, established the firm in 2019, and today the Group manages over 20,000 crore rupees across its PMS and AIF strategies."
  - "An opportunity to bring a differentiated, research-led small-cap proposition to clients from the very beginning."

default_language: "en-IN"
languages:
  - code: "en-IN"
    name: "English"
    # Male Indian-English voice to match the bot name. Other options: Google.en-IN-Wavenet-B,
    # Google.en-IN-Neural2-B (more natural), Polly.Aditi / Polly.Raveena (female).
    twilio_voice: "Google.en-IN-Standard-B"
    twilio_speech_language: "en-IN"
    # Placeholders: {time_of_day} (morning/afternoon/evening, IST), {bot_name}, {amc_name}, {name}.
    greeting: >-
      Good {time_of_day}. My name is {bot_name}, a virtual assistant calling from {amc_name}.
      May I know if I'm speaking with {name}?
  # Hindi and other languages will be enabled after the POC.
